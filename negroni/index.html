<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Negroni Aperitivo Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500;1,700;1,800&family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: menu-card poster. Cream paper, brand-red checker bands between chapters, big warm photos, one red action per screen. */
:root{
  --paper:#FDF7EC;        /* paper of the client's printed menu */
  --paper-2:#F5E9D6;
  --ink:#231D1B;          /* graphite */
  --ink-soft:#5F534D;
  --line:rgba(35,29,27,.14);
  --red:#E2000E;          /* sampled from the client's logo */
  --red-text:#C2000C;
  --on-red:#FFFFFF;
  --bordeaux:#5E0D18;
  --on-bordeaux:#FBEFE3;
  --orange:#E5562A;
  --field:#FFFFFF;
  --focus:#1F5FD1;
  --ok:#2F6B3B;
  --shadow:0 18px 40px -24px rgba(60,20,10,.45);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-head:"Alegreya",Georgia,"Times New Roman",serif;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16110F;--paper-2:#211816;--ink:#F6ECDF;--ink-soft:#C2B3A6;--line:rgba(246,236,223,.16);
  --red:#E2000E;--red-text:#FF6A5C;--on-red:#FFFFFF;--bordeaux:#3B0A11;--on-bordeaux:#FBEFE3;--orange:#FF7A4D;
  --field:#231B19;--focus:#8AB4FF;--ok:#7CC489;--shadow:0 18px 40px -24px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16110F;--paper-2:#211816;--ink:#F6ECDF;--ink-soft:#C2B3A6;--line:rgba(246,236,223,.16);
  --red:#E2000E;--red-text:#FF6A5C;--on-red:#FFFFFF;--bordeaux:#3B0A11;--on-bordeaux:#FBEFE3;--orange:#FF7A4D;
  --field:#231B19;--focus:#8AB4FF;--ok:#7CC489;--shadow:0 18px 40px -24px rgba(0,0,0,.8);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- device frame (presenter "mobile" mode) ---------- */
#device{position:relative}
#app{container:app/inline-size;min-height:100vh;background:var(--paper)}
body.frame{background:#2A2321}
body.frame #stage{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-inline:16px}
body.frame #device{width:390px;max-width:100%;height:min(844px,calc(100vh - 48px));border:10px solid #0E0B0A;border-radius:46px;overflow:hidden;transform:translateZ(0);box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}
body.frame #app{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
body.frame .frame-cap{display:block}
.frame-cap{display:none;color:#CDBFB4;font:500 13px/1.4 var(--f-ui);text-align:center;margin-top:12px}

/* ---------- shared ---------- */
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4cqi,48px)}
.eyebrow{font:600 12px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--red-text)}
.h1,.h2,.h3{font-family:var(--f-head);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
.h2{font-size:clamp(2rem,4.6cqi,3.4rem);line-height:1.02}
.h3{font-size:1.6rem;line-height:1.1}
em.it{font-style:italic;font-weight:700}
.lead{font-size:1.125rem;color:var(--ink-soft);max-width:60ch;margin:0}
.stamp{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.price{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.checker{height:28px;background:repeating-conic-gradient(var(--red) 0 25%,var(--paper) 0 50%) 0 0/28px 28px}
.checker.sm{height:14px;background-size:14px 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:.75em 1.4em;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:1rem;text-decoration:none;line-height:1.1;transition:transform .15s ease,background-color .15s ease,color .15s ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-red:hover{background:color-mix(in srgb,var(--red) 86%,#000)}
.btn-line{border-color:currentColor;background:transparent}
.btn-line:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.btn-ghost{background:transparent;padding-inline:.4em;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.btn-sm{min-height:44px;padding:.6em 1.05em;font-size:.95rem}
.btn[disabled]{opacity:.55;pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:.35em;font:600 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;padding:.5em .7em;border-radius:6px;background:var(--paper-2);color:var(--ink-soft)}
.tag.red{background:var(--red);color:var(--on-red)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
section{scroll-margin-top:84px}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-decoration:none}
.logo img{width:52px;height:52px}
.logo span{font:800 13px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--red-text);text-align:left}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--paper-2);gap:2px}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{border:0;background:none;padding:10px 12px;font-weight:500;border-radius:8px;color:var(--ink)}
.nav button:hover,.nav button[aria-current="page"]{color:var(--red-text)}
.nav button[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.hdr-m{display:none;margin-left:auto;gap:8px;align-items:center}
.chip-city{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);font-weight:600}
.chip-city svg,.icon-btn svg{width:18px;height:18px}
.icon-btn{width:46px;height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);display:grid;place-items:center}

/* ---------- hero ---------- */
.hero{position:relative;color:#FFF7EC;min-height:clamp(560px,64cqi,760px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.04);animation:heroIn 1.6s cubic-bezier(.2,.7,.2,1) both}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(28,8,6,.86) 0%,rgba(28,8,6,.55) 45%,rgba(28,8,6,.05) 80%),linear-gradient(0deg,rgba(28,8,6,.7),transparent 45%)}
@keyframes heroIn{from{transform:scale(1.12)}to{transform:scale(1.04)}}
.hero .wrap{width:100%;padding-block:72px 56px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.hero h1{font-family:var(--f-head);font-weight:800;font-size:clamp(3rem,8cqi,6.6rem);line-height:.92;letter-spacing:-.02em;margin:14px 0 20px;max-width:12ch;text-wrap:balance}
.hero h1 em{font-style:italic;color:#FFB59A;display:block}
.hero p{font-size:1.15rem;max-width:44ch;margin:0 0 28px;color:#F3E3D3}
.hero .eyebrow{color:#FFC2A8}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-line{color:#FFF7EC}
.hero-card{width:300px;padding:22px;border-radius:var(--r);background:rgba(253,247,236,.96);color:#231D1B}
.hero-card .row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(35,29,27,.12);font-size:.95rem}
.hero-card .row:first-of-type{border-top:0}
.hero-card .k{font:600 10px/1.6 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:#7A6B63;min-width:64px}
.hero-card .cityname{font:800 1.9rem/1 var(--f-head);margin:0 0 6px}
.hero-card .lnk{color:#C2000C;font-weight:600;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.kiss{position:absolute;right:clamp(16px,4cqi,48px);top:28px;transform:rotate(6deg);font:800 13px/1.15 var(--f-display);text-transform:uppercase;color:#fff;background:var(--red);padding:10px 14px;border-radius:6px;letter-spacing:.04em}

/* ---------- sections ---------- */
.sec{padding-block:clamp(56px,8cqi,104px)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.sec-head>div{display:grid;gap:12px;min-width:0}

/* locations */
.locs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4cqi,32px)}
.loc{display:flex;flex-direction:column;min-width:0}
.loc .ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;max-width:100%}
.loc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.loc:hover .ph img{transform:scale(1.04)}
.loc .ph .tag{position:absolute;left:14px;top:14px}
.loc .city{font:800 clamp(2.2rem,4cqi,3rem)/1 var(--f-head);margin:20px 0 10px}
.loc dl{margin:0 0 18px;display:grid;gap:6px}
.loc dl div{display:flex;gap:10px}
.loc dt{font:600 10px/2.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);min-width:58px}
.loc dd{margin:0}
.loc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.loc.is-current .ph{outline:3px solid var(--red);outline-offset:4px}

/* about */
.about{background:var(--paper-2)}
.about-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,6cqi,96px);align-items:center}
.about-grid p{margin:0 0 16px;max-width:58ch}
.quote{font:italic 800 clamp(2.2rem,5cqi,4rem)/.98 var(--f-head);color:var(--red-text);margin:0 0 8px;text-wrap:balance}
.quote-tr{color:var(--ink-soft);margin:0 0 28px}
.illu{background:#FDF7EC;border-radius:var(--r);padding:28px 20px 0;overflow:hidden}
.illu img{width:100%}
.illu .lemons{margin:20px -20px 0;height:120px;width:calc(100% + 40px);max-width:none;object-fit:cover}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.facts span{font:600 12px/1.4 var(--f-display);text-transform:uppercase;letter-spacing:.06em}

/* menu */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.menu-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,5cqi,72px)}
.mgroup{margin-bottom:40px;break-inside:avoid}
.mgroup h3{font:800 1.5rem/1.1 var(--f-head);margin:0 0 4px}
.mgroup .note{color:var(--ink-soft);font-size:.92rem;margin:0 0 10px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 0;border-bottom:1px dashed var(--line)}
.mi.has-ph{grid-template-columns:72px minmax(0,1fr) auto}
.mi .ph{width:72px;height:72px;border-radius:10px;object-fit:cover;grid-row:span 2}
.mi .nm{font:800 13px/1.3 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--red-text);min-width:0}
.mi .nm small{display:block;font:500 12px/1.4 var(--f-ui);text-transform:none;letter-spacing:0;color:var(--ink-soft);margin-top:2px}
.mi .ds{grid-column:1/2;font-size:.94rem;color:var(--ink);margin:0;min-width:0}
.mi.has-ph .ds{grid-column:2/3}
.mi .pr{grid-row:1;grid-column:-2/-1;text-align:right}
.mi .vol{display:block;font:500 12px/1.4 var(--f-ui);color:var(--ink-soft);text-align:right}
.mi .tag{margin-left:6px;vertical-align:2px}
.menu-foot{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:20px 0 0;border-top:2px solid var(--ink);margin-top:8px}
.menu-foot p{margin:0;color:var(--ink-soft);font-size:.92rem;max-width:60ch}
.preview-list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 clamp(24px,5cqi,72px)}
.menu-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.48fr);gap:clamp(24px,5cqi,72px);align-items:start}
.menu-hero .shot{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;position:sticky;top:96px}
.menu-hero .shot img{width:100%;height:100%;object-fit:cover}

/* events */
.evs{display:grid;gap:0}
.ev{display:grid;grid-template-columns:120px minmax(0,220px) minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px 0;border-top:1px solid var(--line)}
.ev:last-child{border-bottom:1px solid var(--line)}
.ev .date{display:grid;gap:2px}
.ev .date b{font:800 3rem/.9 var(--f-display);color:var(--red-text);font-variant-numeric:tabular-nums}
.ev .date span{font-weight:600;font-size:.92rem}
.ev .date small{color:var(--ink-soft);font-size:.85rem}
.ev .ph{aspect-ratio:3/2;border-radius:10px;overflow:hidden;max-width:100%}
.ev .ph img{width:100%;height:100%;object-fit:cover}
.ev h3{font:800 1.55rem/1.1 var(--f-head);margin:6px 0 6px}
.ev p{margin:0;color:var(--ink-soft);max-width:56ch}
.ev .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:40px clamp(20px,4cqi,48px);border-radius:var(--r);background:var(--paper-2);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.empty .glass{width:84px;height:84px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.empty .glass svg{width:42px;height:42px;color:#fff}
.empty h3{font:800 1.6rem/1.1 var(--f-head);margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--ink-soft);max-width:52ch}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(140px,17cqi,240px);gap:10px}
.gal figure{margin:0;border-radius:10px;overflow:hidden;min-width:0}
.gal img{width:100%;height:100%;object-fit:cover}
.gal .t{grid-row:span 2}
.gal .w{grid-column:span 2}

/* contacts */
.contacts{background:var(--bordeaux);color:var(--on-bordeaux)}
.contacts .eyebrow{color:#FFB59A}
.c-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(32px,6cqi,96px)}
.c-main .addr{font:800 clamp(2rem,4.4cqi,3.2rem)/1.02 var(--f-head);margin:14px 0 24px;text-wrap:balance}
.c-rows{display:grid;gap:0;margin-bottom:28px}
.c-rows div{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:14px 0;border-top:1px solid rgba(251,239,227,.18)}
.c-rows dt{font:600 10px/1.4 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:#E7C9B6;min-width:92px}
.c-rows dd{margin:0;font-size:1.05rem;font-weight:500}
.copy{border:1px solid rgba(251,239,227,.4);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font-size:.85rem;min-height:36px}
.c-actions{display:flex;flex-wrap:wrap;gap:10px}
.contacts .btn-line{color:var(--on-bordeaux)}
.other{display:grid;gap:0;align-content:start}
.other button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:18px 0;border-top:1px solid rgba(251,239,227,.18)}
.other button:focus-visible{outline:3px solid #8AB4FF;outline-offset:2px}
.other b{font:800 1.6rem/1 var(--f-head)}
.other span{color:#E7C9B6;font-size:.95rem;grid-column:1}
.other i{font-style:normal;grid-row:span 2;align-self:center;font-weight:600;text-decoration:underline;text-underline-offset:4px}

/* footer */
.ftr{background:#120D0C;color:#CDBFB4;padding-block:40px 120px;font-size:.92rem}
.ftr .wrap{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;justify-content:space-between}
.ftr .kk{font:800 clamp(1.4rem,3cqi,2.2rem)/1 var(--f-display);color:#FF3B30;text-transform:uppercase}
.ftr p{margin:0}
.ftr .warn{flex-basis:100%;border-top:1px solid rgba(255,255,255,.12);padding-top:18px;color:#9E8F86}

/* ---------- page heads (inner views) ---------- */
.phead{padding-block:clamp(36px,6cqi,72px) 28px}
.phead .h1{font-size:clamp(2.6rem,6.4cqi,5rem);line-height:.95;margin:12px 0 14px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--ink-soft)}
.crumbs button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.crumbs button:focus-visible{outline:3px solid var(--focus)}
.pick{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:20px}
.pick label{font-weight:600;font-size:.95rem}

/* location page */
.l-hero{position:relative;color:#FFF7EC;isolation:isolate;min-height:clamp(380px,42cqi,560px);display:flex;align-items:flex-end}
.l-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.l-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(28,8,6,.85),rgba(28,8,6,.1) 65%)}
.l-hero .wrap{width:100%;padding-block:40px}
.l-hero .h1{font-size:clamp(3rem,8cqi,6.4rem);line-height:.9;margin:10px 0 0}
.l-hero .crumbs{color:#F3E3D3}
.l-body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:clamp(32px,5cqi,72px);padding-block:48px}
.l-body .lead{color:var(--ink);font-size:1.2rem;margin-bottom:12px}
.infobox{border:2px solid var(--ink);border-radius:var(--r);padding:24px;align-self:start;position:sticky;top:96px;background:var(--paper)}
.infobox dl{margin:0 0 18px;display:grid}
.infobox dl div{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:2px}
.infobox dl div:first-child{border-top:0;padding-top:0}
.infobox dt{font:600 10px/1.4 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.infobox dd{margin:0;font-weight:500;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.infobox .copy{border-color:var(--line)}
.infobox .btn{width:100%}
.infobox .links{display:grid;gap:4px;margin-top:12px}
.infobox .links a{font-weight:600;color:var(--red-text);padding:8px 0}
.l-section{margin-top:56px}
.l-section>.h2{font-size:clamp(1.8rem,3.6cqi,2.6rem);margin-bottom:20px}

/* ---------- booking ---------- */
.bk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(28px,5cqi,72px);padding-block:32px 64px;align-items:start}
.progress{display:grid;gap:10px;margin-bottom:28px}
.progress .bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.progress .bar i{height:6px;border-radius:3px;background:var(--line)}
.progress .bar i.on{background:var(--red)}
.progress .lbl{display:flex;justify-content:space-between;gap:12px;font-size:.92rem;color:var(--ink-soft);flex-wrap:wrap}
.progress .lbl b{color:var(--ink)}
.bk h2:focus{outline:none}
.bk form{min-width:0}
.bk .chips .chip{min-width:0}
.bk h2{font:800 clamp(2rem,4.4cqi,3rem)/1 var(--f-head);margin:0 0 8px;text-wrap:balance}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
const fDay=new Intl.DateTimeFormat('uk-UA',{weekday:'short'});
const fLong=new Intl.DateTimeFormat('uk-UA',{weekday:'long',day:'numeric',month:'long'});
const fMon=new Intl.DateTimeFormat('uk-UA',{month:'long',day:'numeric'});
function monthOf(d){return fMon.format(d).replace(/^\d+\s*/,'')}
function slots(){const a=[];for(let m=15*60;m<=22*60;m+=30)a.push(String(Math.floor(m/60)).padStart(2,'0')+':'+(m%60?'30':'00'));return a}
function slotPast(dateIso,t){if(dateIso!==iso(today()))return false;const [h,m]=t.split(':').map(Number);const n=new Date();return h*60+m<n.getHours()*60+n.getMinutes()+30}
function guestsWord(n){const a=n%10,b=n%100;if(a===1&&b!==11)return n+' гість';if(a>=2&&a<=4&&(b<12||b>14))return n+' гості';return n+' гостей'}
function fmtPhone(d){d=d.replace(/\D/g,'').slice(0,9);const p=[d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean);return p.join(' ')}
function kyivMin(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value}

      <li><span class="ok-dot"></span><b>Логотип, кольори, ілюстрації, слогани</b> — з матеріалів бренду.</li></ul>
    <h3>Запропонувати / демо</h3><ul>
      <li><span class="demo-dot"></span><b>«Зараз у барі: вільно / майже повно»</b> — демо. У робочій версії адміністратор раз на вечір тисне кнопку в Telegram-боті.</li>
      <li><span class="demo-dot"></span><b>Заявка на свято від 10 гостей</b> — уточнити у власника, чи приймають компанії. Заявка йде менеджеру в Telegram; зараз форма нікуди не надсилає.</li>
      <li><span class="demo-dot"></span><b>Фотографії</b> — стокові (Unsplash), замінити на фото закладів.</li>
      <li><span class="demo-dot"></span><b>Події</b> — приклади з позначкою «Демо-анонс».</li>
      <li><span class="demo-dot"></span><b>Описи локацій і «Про нас»</b> — чернетки копірайту.</li></ul>
  </div>`;
}

/* ======================== RENDER ======================== */
const app=$('#app');
function render(focusSel){
  const views={home:vHome,locations:vLocations,location:vLocation,menu:vMenu,events:vEvents,party:vParty,success:vSuccess};
  const inBk=S.view==='party'||S.view==='success';
  app.className=inBk?'no-mbar':'';
  app.innerHTML=header()+`<main id="main">${views[S.view]()}</main>`+(S.view==='party'?'':footer())+mbar()+sheet();
  $('#devLayer').innerHTML=devPanel();
  document.body.classList.toggle('frame',S.frame);
  if(focusSel){const el=$(focusSel);if(el)el.focus({preventScroll:true})}
}
function scroller(){return S.frame?app:document.scrollingElement}
function toTop(){scroller().scrollTo({top:0,behavior:'instant'})}
function go(view,opts={}){
  if(view==='about'){S.view='home';S.sheet=null;render();requestAnimationFrame(()=>{const a=$('#about');if(a)a.scrollIntoView({behavior:'smooth'})});return}
  if(view!=='party'&&view!=='success')S.prev=view;
  S.view=view;S.sheet=null;render(opts.focus);if(!opts.keepScroll)toTop();
}
function setCity(id,silent){if(!CITIES[id])return;S.city=id;store.set('negroni.city',id);if(S.view==='events')S.evCity=id;if(!silent)toast('Місто: '+CITIES[id].name)}
let tt;function toast(t){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;tt=setTimeout(()=>el.remove(),1600)}

/* ---------- party validation ---------- */
function validate(){
  const p=S.pt,e={};
  if(!p.date)e.date='Оберіть дату свята.';else if(fromIso(p.date)<today())e.date='Ця дата вже минула. Оберіть сьогодні або пізніше.';
  const n=+p.guests;if(!n||n<10)e.guests='Заявки приймаємо для компаній від 10 гостей. Якщо вас менше, просто приходьте.';else if(n>120)e.guests='Для понад 120 гостей зателефонуйте в бар напряму.';
  if(p.name.trim().length<2)e.name='Ім’я має містити щонайменше 2 літери.';else if(!/^[\p{L}\s'’ʼ-]+$/u.test(p.name.trim()))e.name='Ім’я може містити лише літери, пробіл, дефіс чи апостроф.';
  const d=p.phone.replace(/\D/g,'');if(!d)e.phone='Вкажіть номер телефону, щоб менеджер міг з вами зв’язатися.';else if(d.length!==9)e.phone='Номер має містити 9 цифр після +380. Зараз: '+d.length+'.';
  p.errors=e;return !Object.keys(e).length;
}
function gcal(e){
  const pad=n=>String(n).padStart(2,'0'),d=e.date,[h,m]=e.time.split(':').map(Number),day=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`,c=CITIES[e.city];
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title+' · Negroni '+c.name)+'&dates='+day+'T'+pad(h)+pad(m)+'00/'+day+'T'+pad(Math.min(h+3,23))+pad(m)+'00&ctz=Europe/Kyiv&location='+encodeURIComponent('Negroni Aperitivo Bar, '+c.address+', '+c.name)+'&details='+encodeURIComponent(e.text);
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,a,[data-close]');if(!t)return;
  const d=t.dataset;
  if(d.close!==undefined&&ev.target!==t)return; // click inside sheet
  if(d.close!==undefined||d.closeBtn!==undefined){S.sheet=null;render();return}
  if(d.devClose!==undefined){S.dev=false;render();$('#devTab').focus();return}
  if(d.frame!==undefined){S.frame=d.frame==='1';render();toTop();return}
  if(d.demoOpen!==undefined){S.forceOpen=d.demoOpen==='1'?true:null;render();return}
  if(d.jump){jump(d.jump);return}
  if(d.setCity)setCity(d.setCity,true);
  if(d.city!==undefined&&t.closest('.seg')&&!d.evcity){setCity(d.city);render();return}
  if(d.evcity){S.evCity=d.evcity==='all'?null:d.evcity;if(d.evcity!=='all')setCity(d.evcity,true);render();return}
  if(d.go){if(d.go==='party')S.pt=newParty();go(d.go,d.go==='party'?{focus:'#pt-h'}:{});return}
  if(d.sheet){S.sheet=d.sheet;render();const f=$('.sheet input:checked,.sheet button');f&&f.focus();return}
  if(d.cat){S.menuCat=d.cat;render('[data-cat="'+d.cat+'"]');return}
  if(d.copy){const done=()=>toast('Номер скопійовано');try{navigator.clipboard.writeText(d.copy).then(done,()=>selectText(t))}catch(e){selectText(t)}return}
  if(!S.pt)return;
  if(d.pcity){S.pt.city=d.pcity;setCity(d.pcity,true);render('[data-pcity="'+d.pcity+'"]');return}
  if(d.occ){S.pt.occ=S.pt.occ===d.occ?'':d.occ;render('[data-occ="'+d.occ+'"]');return}
});
function selectText(btn){const dd=btn.previousElementSibling||btn.parentNode;const r=document.createRange();r.selectNodeContents(dd);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Виділено — скопіюйте вручну')}
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.name==='sh-city'){setCity(t.value);S.sheet=null;render();return}
  if(t.id==='pt-date'&&S.pt){S.pt.date=t.value;if(S.pt.errors.date){delete S.pt.errors.date;render('#pt-date')}}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!S.pt)return;
  if(t.id==='pt-name')S.pt.name=t.value;
  if(t.id==='pt-guests')S.pt.guests=t.value;
  if(t.id==='pt-comment')S.pt.comment=t.value;
  if(t.id==='pt-phone'){const digits=t.value.replace(/\D/g,'').replace(/^(380|80|0)(?=\d{9})/,'').slice(0,9);S.pt.phone=digits;const f=fmtPhone(digits);if(t.value!==f)t.value=f}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id!=='ptForm')return;ev.preventDefault();
  if(!validate()){render('[aria-invalid="true"]');const first=$('.err');first&&first.scrollIntoView({block:'center',behavior:'smooth'});return}
  const btn=$('#ptSend');btn.disabled=true;btn.textContent='Надсилаємо…';
  setTimeout(()=>{S.sent={...S.pt};S.pt=null;go('success')},900);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(S.sheet){S.sheet=null;render()}else if(S.dev){S.dev=false;render()}}});
$('#devTab').addEventListener('click',()=>{S.dev=!S.dev;render();const x=$('.dev .x');x&&x.focus()});

function jump(k){
  if(S.frame)S.dev=true;else S.dev=window.innerWidth>900?S.dev:false;
  const tm=new Date(today());tm.setDate(tm.getDate()+12);
  switch(k){
    case'home':go('home');break;
    case'locations':go('locations');break;
    case'sheet':go('home');S.sheet='city';render();break;
    case'loc-odesa':setCity('odesa',true);go('location');break;
    case'party':S.pt=newParty();go('party');break;
    case'party-err':S.pt=newParty({guests:'6',name:'О',phone:'6712'});validate();go('party');break;
    case'ok':S.sent={...newParty(),date:iso(tm),guests:'18',occ:'День народження',name:'Олена',phone:'671234567',comment:'Сет піци й негроні на всіх, приблизно з 19:00'};go('success');break;
    case'menu':setCity('lviv',true);S.menuCat='food';go('menu');break;
    case'events':S.evCity=null;go('events');break;
    case'ev-empty':setCity('lviv',true);S.evCity='lviv';go('events');break;
  }
}
render();
/* deep links for the pitch: #party, #ok, #menu … ; #m-… opens the phone frame; …-open forces the "open now" state */
const JUMPS=['home','locations','sheet','loc-odesa','party','party-err','ok','menu','events','ev-empty'];
let h0=location.hash.slice(1);if(h0.endsWith('-open')){S.forceOpen=true;h0=h0.slice(0,-5)}
if(h0.startsWith('m-')&&innerWidth>700){S.frame=true;h0=h0.slice(2);render()}
if(JUMPS.includes(h0))jump(h0);if(S.frame){S.dev=false;render()}
</script>
