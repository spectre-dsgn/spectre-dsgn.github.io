<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Spectre Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: split workspace. Filterable lead list on the left, full dossier on the right; one column on phones. */
:root{
  --bg:#eef0f5; --surface:#ffffff; --surface2:#f5f6fa; --ink:#161923; --muted:#5d6376; --line:#dadde9;
  --accent:#4a3fd0; --accent-ink:#ffffff; --accent-soft:#e9e7fb;
  --ok:#0f7a4d; --ok-soft:#dcf3e8; --warn:#8f5600; --warn-soft:#fcefd0; --bad:#b3261e; --bad-soft:#fbe3e1; --info:#1b5fb8; --info-soft:#e0ecfb;
  --font-ui:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1017; --surface:#161924; --surface2:#1c2030; --ink:#e9ebf4; --muted:#9298ad; --line:#272b3b;
    --accent:#9a91ff; --accent-ink:#0e1017; --accent-soft:#25234a;
    --ok:#4fd39b; --ok-soft:#12332a; --warn:#f0b64a; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1b19; --info:#7db4ff; --info-soft:#16284a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#161924; --surface2:#1c2030; --ink:#e9ebf4; --muted:#9298ad; --line:#272b3b;
  --accent:#9a91ff; --accent-ink:#0e1017; --accent-soft:#25234a;
  --ok:#4fd39b; --ok-soft:#12332a; --warn:#f0b64a; --warn-soft:#3a2d12; --bad:#ff8a80; --bad-soft:#3d1b19; --info:#7db4ff; --info-soft:#16284a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-weight:700;letter-spacing:.14em;font-size:15px}
.brand .sub{font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.banner[hidden]{display:none}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select,.field input,.field select,.field textarea,.notes{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 220px}
.filters select{flex:0 1 170px}

.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:14px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-bot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.fit{display:inline-flex;gap:2px;align-items:center}
.fit i{width:5px;height:12px;border-radius:2px;background:var(--line)}
.fit i.on{background:var(--accent)}
.pill{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.new{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.contacted,.pill.replied,.pill.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.won{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.lost{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tg-mark{font-family:var(--font-mono);font-size:11px;color:var(--ok)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;position:sticky;top:12px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain}
.d-head{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:22px;font-weight:700;overflow-wrap:anywhere;text-wrap:balance}
.d-head .meta{color:var(--muted);margin-top:2px}
.d-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.d-ctl select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.back{display:none}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-family:var(--font-mono);font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface2);min-width:0}
.chip.pri{border-color:var(--accent)}
.chip .k{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:62px;flex:none}
.chip .v{font-family:var(--font-mono);font-size:12.5px;overflow-wrap:anywhere;min-width:0;flex:1}
.chip a{color:var(--accent);text-decoration:none}
.chip a:hover{text-decoration:underline}
.chip.none .v{color:var(--muted)}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px;font-size:12px;flex:none}
.icon-btn:hover{color:var(--accent);background:var(--accent-soft)}
ul.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.msg{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.gen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.gen input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 10px;width:140px}
.gen-out{margin-top:8px}
.evid{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.evid a{color:var(--accent)}
.notes{width:100%;min-height:90px;resize:vertical}
.hint{color:var(--muted);font-size:12.5px}
.why{color:var(--muted);font-size:13px;margin-top:6px}

.how{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.how .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.how h3{margin:0 0 6px;font-size:15px}
.how p{margin:0 0 6px;color:var(--muted)}
.how-lead{max-width:70ch;color:var(--muted);margin:0 0 14px}

.overlay{position:fixed;inset:0;background:rgba(10,12,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:20}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);padding:18px 20px;margin-top:4vh}
.modal h2{margin:0 0 12px;font-size:18px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field textarea{min-height:70px;resize:vertical}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}

@media (max-width:900px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split.open .list{display:none}
  .split:not(.open) .detail{display:none}
  .detail{position:static;max-height:none;overflow:visible}
  .back{display:inline-block}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:minmax(0,1fr)}
  .fgrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>SPECTRE</b><span class="sub">Leads</span></div>
    <div class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab" role="tab" id="tab-base" data-tab="base" aria-selected="true">База</button>
      <button class="tab" role="tab" id="tab-how" data-tab="how" aria-selected="false">Где искать</button>
    </div>
    <div class="actions">
      <button class="btn" id="btn-export" type="button">Экспорт CSV</button>
      <button class="btn primary" id="btn-add" type="button">+ Лид</button>
    </div>
  </header>
  <div class="banner" id="banner" hidden></div>

  <main id="view-base">
    <section class="stats" id="stats" aria-label="Сводка"></section>
    <section class="filters" aria-label="Фильтры">
      <input id="f-q" type="search" placeholder="Поиск по названию, нише, городу, заметкам" aria-label="Поиск">
      <select id="f-status" aria-label="Статус"></select>
      <select id="f-niche" aria-label="Ниша"></select>
      <select id="f-country" aria-label="Страна"></select>
      <select id="f-sort" aria-label="Сортировка">
        <option value="fit">Сначала сильные</option>
        <option value="touched">Недавно обновлённые</option>
        <option value="name">По названию</option>
      </select>
    </section>
    <div class="split" id="split">
      <aside class="list" id="list" aria-label="Список лидов"></aside>
      <article class="detail" id="detail" aria-live="polite"></article>
    </div>
  </main>

  <main id="view-how" hidden></main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <h2 id="add-title">Новый лид</h2>
    <div class="fgrid">
      <div class="field full"><label for="a-name">Название *</label><input id="a-name" autocomplete="off"></div>
      <div class="field"><label for="a-niche">Ниша</label><input id="a-niche" placeholder="Кафе, салон, магазин" autocomplete="off"></div>
      <div class="field"><label for="a-country">Страна</label><input id="a-country" autocomplete="off"></div>
      <div class="field"><label for="a-city">Город</label><input id="a-city" autocomplete="off"></div>
      <div class="field"><label for="a-site">Сайт</label><input id="a-site" placeholder="https://" autocomplete="off"></div>
      <div class="field"><label for="a-tg">Telegram</label><input id="a-tg" placeholder="@username" autocomplete="off"></div>
      <div class="field"><label for="a-ig">Instagram</label><input id="a-ig" placeholder="@username" autocomplete="off"></div>
      <div class="field"><label for="a-wa">WhatsApp</label><input id="a-wa" placeholder="+971..." autocomplete="off"></div>
      <div class="field"><label for="a-mail">Email</label><input id="a-mail" autocomplete="off"></div>
      <div class="field"><label for="a-phone">Телефон</label><input id="a-phone" autocomplete="off"></div>
      <div class="field"><label for="a-budget">Бюджет (только если известен)</label><input id="a-budget" autocomplete="off"></div>
      <div class="field"><label for="a-fit">Приоритет 1-5</label>
        <select id="a-fit"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
      <div class="field full"><label for="a-notes">Что известно о них, что заметили на сайте или в соцсетях</label>
        <textarea id="a-notes" placeholder="Например: сайт без цен, записываются через директ Instagram, скоро открывают вторую точку"></textarea></div>
      <div class="field full"><label for="a-needs">Что им нужно (по одному пункту в строке)</label><textarea id="a-needs"></textarea></div>
      <div class="field full"><label for="a-offer">Что предложить (по одному пункту в строке)</label><textarea id="a-offer"></textarea></div>
      <div class="field full"><label for="a-pitch">Сообщение для отправки</label><textarea id="a-pitch"></textarea></div>
    </div>
    <p class="hint" id="a-hint"></p>
    <div class="modal-foot">
      <button class="btn" id="a-ai" type="button" hidden>ИИ: заполнить нужды, оффер и текст</button>
      <button class="btn" id="a-cancel" type="button">Отмена</button>
      <button class="btn primary" id="a-save" type="button">Сохранить</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const STATUS=[["new","Новый"],["contacted","Написали"],["replied","Ответили"],["demo","Демо отправлено"],["won","Сделка"],["lost","Отказ"]];
const SLABEL=Object.fromEntries(STATUS);
const CONF={site:["Проверено на сайте","ok"],listing:["Из стороннего источника","warn"],unverified:["Нужна проверка","bad"],manual:["Добавлено менеджером","info"]};
const S={leads:[],loaded:false,sel:null,tab:"base",q:"",fStatus:"",fNiche:"",fCountry:"",sort:"fit",lang:"main",gen:{text:"",busy:false,ctl:null}};
let db=null,user=null,sample=null,downloads=null,me={id:null,isOwner:false,canEdit:false},canWrite=true;
const queue={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const arr=v=>Array.isArray(v)?v:[];
const lines=t=>String(t||"").split("\n").map(s=>s.trim()).filter(Boolean);
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},2600)}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast("Скопировано");}
  catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    ta.remove();toast(ok?"Скопировано":"Выделите текст и скопируйте вручную");
  }
}
const handle=v=>String(v||"").trim().replace(/^https?:\/\/(www\.)?(instagram\.com|t\.me|tiktok\.com)\//i,"").replace(/^@/,"").replace(/\/.*$/,"");
const digits=v=>String(v||"").replace(/[^\d]/g,"");
const url=v=>{v=String(v||"").trim();if(!v)return"";return /^https?:\/\//i.test(v)?v:"https://"+v};

function contactRows(l){
  const c=l.contacts||{};
  const rows=[];
  rows.push(["Telegram",c.telegram?"@"+handle(c.telegram):"",c.telegram?"https://t.me/"+handle(c.telegram):"",true]);
  rows.push(["Instagram",c.instagram?"@"+handle(c.instagram):"",c.instagram?"https://instagram.com/"+handle(c.instagram):"",true]);
  rows.push(["WhatsApp",c.whatsapp||"",digits(c.whatsapp)?"https://wa.me/"+digits(c.whatsapp):"",false]);
  rows.push(["Email",c.email||"",c.email?"mailto:"+c.email:"",false]);
  rows.push(["Телефон",c.phone||"",digits(c.phone)?"tel:+"+digits(c.phone):"",false]);
  rows.push(["Сайт",l.website||"",url(l.website),false]);
  rows.push(["TikTok",c.tiktok?"@"+handle(c.tiktok):"",c.tiktok?"https://www.tiktok.com/@"+handle(c.tiktok):"",false]);
  rows.push(["Facebook",c.facebook||"",c.facebook?(/^https?:/i.test(c.facebook)?c.facebook:"https://www.facebook.com/search/top?q="+encodeURIComponent(c.facebook)):"",false]);
  rows.push(["Другое",c.other||"","",false]);
  return rows;
}

/* ---------- list ---------- */
function hay(l){const c=l.contacts||{};return [l.name,l.niche,l.city,l.country,l.notes,l.website,...Object.values(c)].join(" ").toLowerCase()}
function cmp(a,b){
  if(S.sort==="name")return String(a.name).localeCompare(String(b.name));
  if(S.sort==="touched")return (b.touched||0)-(a.touched||0);
  return (b.fit||0)-(a.fit||0)||String(a.name).localeCompare(String(b.name));
}
function visible(){
  const q=S.q.trim().toLowerCase();
  return S.leads.filter(l=>(!S.fStatus||(l.status||"new")===S.fStatus)&&(!S.fNiche||l.niche===S.fNiche)&&(!S.fCountry||l.country===S.fCountry)&&(!q||hay(l).includes(q))).sort(cmp);
}
function fitDots(n){n=Number(n)||0;return '<span class="fit" role="img" aria-label="Приоритет '+n+' из 5" title="Приоритет '+n+' из 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=n?"on":"")+'"></i>').join("")+'</span>'}
function renderStats(){
  const L=S.leads,st=l=>l.status||"new";
  const work=L.filter(l=>["contacted","replied","demo"].includes(st(l))).length;
  const items=[["Всего",L.length],["Новые",L.filter(l=>st(l)==="new").length],["В работе",work],["Сделки",L.filter(l=>st(l)==="won").length]];
  $("stats").innerHTML=items.map(([k,v])=>'<div class="stat"><b>'+v+'</b><span>'+k+'</span></div>').join("");
}
function fillSelect(id,first,vals,cur){
  const el=$(id);el.innerHTML='<option value="">'+first+'</option>'+vals.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join("");
  el.value=vals.some(([v])=>v===cur)?cur:"";
}
function renderFilters(){
  const uniq=k=>[...new Set(S.leads.map(l=>l[k]).filter(Boolean))].sort().map(v=>[v,v]);
  fillSelect("f-status","Все статусы",STATUS,S.fStatus);
  fillSelect("f-niche","Все ниши",uniq("niche"),S.fNiche);
  fillSelect("f-country","Все страны",uniq("country"),S.fCountry);
}
function renderList(){
  const v=visible(),el=$("list");
  if(!S.loaded){el.innerHTML='<div class="empty"><b>Загружаю базу</b>Лиды появятся через секунду.</div>';return}
  if(!S.leads.length){el.innerHTML='<div class="empty"><b>База пока пуста</b>Нажмите «+ Лид», чтобы добавить первого. Откройте вкладку «Где искать», если нужны идеи, где их взять.</div>';return}
  if(!v.length){el.innerHTML='<div class="empty"><b>Ничего не найдено</b>Сбросьте фильтры или измените запрос.</div>';return}
  el.innerHTML=v.map(l=>{
    const st=l.status||"new",tg=(l.contacts||{}).telegram;

      '<div class="card-top"><div><h3>'+esc(l.name)+'</h3><div class="meta">'+esc([l.niche,l.city,l.country].filter(Boolean).join(" · "))+'</div></div>'+fitDots(l.fit)+'</div>'+

}

let detailSig="";
function sigOf(l){const c={...l};delete c.notes;delete c.touched;delete c.touchedBy;return JSON.stringify(c)+"|"+S.lang+"|"+canWrite+"|"+me.canEdit}

    detailSig="";

  const sig=sigOf(l);

   (me.id&&canWrite?'<button type="button" class="btn small" id="d-take">'+(mine?'Снять с себя':'Взять себе')+'</button>':'')+
   (me.canEdit?'<button type="button" class="btn small" id="d-del">Удалить</button>':'')+'</div></div>'+
   '<div class="sec"><h4>Контакты</h4><div class="contacts">'+chips+'</div></div>'+
   '<div class="sec two"><div><h4>Что им нужно</h4>'+(needs.length?'<ul class="pts">'+needs.map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>':'<span class="hint">Пока не заполнено</span>')+'</div>'+

async function fillNames(){
  const els=[...document.querySelectorAll("[data-uid]")];
  if(!els.length||!user)return;
  try{const ids=[...new Set(els.map(e=>e.dataset.uid))];const ps=await user.profiles(ids);els.forEach(e=>{e.textContent=(ps[e.dataset.uid]&&ps[e.dataset.uid].name)||"менеджер"})}catch(_){}
}

/* ---------- writes ---------- */
function save(id,patch){
  local.over[id]=Object.assign(local.over[id]||{},patch);
  persist();
  S.leads=buildLeads();
  renderAll(false);
  return Promise.resolve();
}
function writeFail(e){
  if(e&&(e.code==="invalid_argument"||e.code==="revoked")){canWrite=false;renderAll(true);toast("Нет прав на изменение. Попросите владельца выдать доступ «Contributor».")}
  else toast("Не удалось сохранить, попробуйте ещё раз");
}
let notesTimer=null;
function onNotes(e){
  const ta=e.target;if(ta.id!=="d-notes")return;
  clearTimeout(notesTimer);$("d-saved").textContent="Сохраняю…";
  notesTimer=setTimeout(()=>{save(ta.dataset.id,{notes:ta.value}).then(()=>{const s=$("d-saved");if(s)s.textContent="Сохранено"}).catch(writeFail)},700);
}

function leadForAI(l){return {name:l.name,niche:l.niche,country:l.country,city:l.city,website:l.website,needs:l.needs,offer:l.offer,notes:l.notes,contacts:l.contacts}}
async function genPitch(l){
  const lang=($("g-lang").value||"English").trim();
  const prompt="Ты менеджер по продажам студии Spectre Studio: дизайн, анимация, 3D, сайты, Telegram-боты и автоматизация для бизнеса.\nНапиши первое холодное сообщение этому потенциальному клиенту.\nПравила: пиши как живой человек, коротко и просто, не больше 80 слов; без поздравлений и комплиментов; без имени и подписи отправителя и без шаблонных скобок; назови студию «Spectre Studio» один раз; одна конкретная наблюдаемая проблема из данных ниже; предложи бесплатную демо-версию и скажи, что можешь прислать её на днях, если им интересно (не спрашивай «можно прислать?»); ничего не выдумывай; без цены; в конце две ссылки: пример нашей работы, который тоже демо-версия, spectre-dsgn.github.io/negroni/ и концепт-сайт https://spectreportfolio.github.io/#/ (десять примеров сайтов для разных бизнесов, где можно вписать название своего заведения). Язык сообщения:"+lang+".\nДанные о клиенте (JSON):\n"+JSON.stringify(leadForAI(l))+"\nВерни только текст сообщения.";
  const out=$("g-out");S.gen.ctl=new AbortController();S.gen.busy=true;S.gen.text="";
  $("g-run").disabled=true;$("g-stop").hidden=false;out.innerHTML='<div class="msg">Думаю…</div>';
  try{
    const r=await sample(prompt,{signal:S.gen.ctl.signal,cache:false,onText:({text})=>{S.gen.text=text;out.firstChild.textContent=text}});
    S.gen.text=r.text;
    out.innerHTML='<div class="msg"></div><div class="msg-bar" style="margin-top:8px"><button type="button" class="btn small" data-copy="'+esc(r.text)+'">Скопировать</button><button type="button" class="btn small primary" id="g-save">Сохранить как основной</button></div>';
    out.firstChild.textContent=r.text;
    $("g-save").onclick=()=>save(l.id,{pitch:r.text,pitch_lang:lang.toLowerCase().startsWith("рус")?"RU":lang.slice(0,2).toUpperCase(),pitch_ru:""}).then(()=>{S.lang="main";toast("Сохранено")}).catch(writeFail);
  }catch(e){
    if(e&&e.code==="cancelled")out.innerHTML=e.text?'<div class="msg"></div>':"";
    else out.innerHTML='<div class="hint">'+esc(aiError(e))+'</div>';
    if(e&&e.text&&out.firstChild)out.firstChild.textContent=e.text;
  }finally{
    S.gen.busy=false;const run=$("g-run");if(run)run.disabled=false;const stop=$("g-stop");if(stop)stop.hidden=true;
  }
}
function aiError(e){
  const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled")return"ИИ-помощник не разрешён для этого аккаунта.";
  if(c==="rate_limited")return"Слишком много запросов. Попробуйте позже.";
  if(c==="invalid_json")return"ИИ ответил не в том формате. Нажмите ещё раз.";
  return"Не получилось, нажмите ещё раз.";
}

    if(Array.isArray(r.needs))$("a-needs").value=r.needs.join("\n");
    if(Array.isArray(r.offer))$("a-offer").value=r.offer.join("\n");

/* ---------- export ---------- */
async function exportCsv(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const head=["Название","Ниша","Страна","Город","Приоритет","Telegram","Instagram","WhatsApp","Email","Телефон","Сайт","Что нужно","Что предложить","Бюджет","Статус","Заметки","Сообщение"];
  const rows=visible().map(l=>{const c=l.contacts||{};return [l.name,l.niche,l.country,l.city,l.fit,c.telegram,c.instagram,c.whatsapp,c.email,c.phone,l.website,arr(l.needs).join("; "),arr(l.offer).join("; "),l.budget,SLABEL[l.status||"new"],l.notes,l.pitch].map(q).join(",")});
  try{const blob=new Blob(["\ufeff"+[head.map(q).join(","),...rows].join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="spectre-leads.csv";document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
  catch(e){toast("Не удалось сохранить файл")}
}

/* ---------- wiring ---------- */
function renderAll(force){renderStats();renderFilters();renderList();renderDetail(force)}
function setTab(t){
  S.tab=t;$("view-base").hidden=t!=="base";$("view-how").hidden=t!=="how";
  ["base","how"].forEach(k=>$("tab-"+k).setAttribute("aria-selected",String(k===t)));
  if(t==="how"&&!$("view-how").innerHTML)renderHow();
}
document.addEventListener("click",e=>{
  const t=e.target;
  const tab=t.closest("[data-tab]");if(tab){setTab(tab.dataset.tab);return}
  const cp=t.closest("[data-copy]");if(cp){copy(cp.dataset.copy);return}
  const card=t.closest(".card");if(card){S.sel=card.dataset.id;S.lang="main";renderList();renderDetail(true);$("split").classList.add("open");$("detail").scrollTop=0;if(!matchMedia("(min-width:901px)").matches)$("split").scrollIntoView({block:"start"});return}
  const lg=t.closest("[data-lang]");if(lg){S.lang=lg.dataset.lang;renderDetail(true);return}
  if(t.id==="d-back"){$("split").classList.remove("open");return}
  if(t.id==="d-take"){const l=S.leads.find(x=>x.id===S.sel);if(l)save(l.id,{assignee:l.assignee===me.id?null:me.id}).catch(writeFail);return}
  if(t.id==="d-del"){
    if(t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Точно удалить?";setTimeout(()=>{if(t.isConnected){t.dataset.sure="";t.textContent="Удалить"}},3000);return}
    const id=S.sel;db.doc("leads/"+id).delete().then(()=>{S.sel=null;$("split").classList.remove("open");toast("Удалено")}).catch(writeFail);return
  }
  if(t.id==="g-run"){const l=S.leads.find(x=>x.id===S.sel);if(l&&sample)genPitch(l);return}
  if(t.id==="g-stop"){S.gen.ctl&&S.gen.ctl.abort();return}
  if(t.id==="btn-add"){openAdd();return}
  if(t.id==="btn-export"){exportCsv();return}
  if(t.id==="a-cancel"||t===$("overlay")){$("overlay").hidden=true;return}
  if(t.id==="a-save"){addLead();return}
  if(t.id==="a-ai"){aiFill();return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="d-status"){const l=S.leads.find(x=>x.id===S.sel);if(l)save(l.id,{status:t.value}).catch(writeFail);return}
  if(t.id==="f-status"){S.fStatus=t.value;renderList()}
  if(t.id==="f-niche"){S.fNiche=t.value;renderList()}
  if(t.id==="f-country"){S.fCountry=t.value;renderList()}
  if(t.id==="f-sort"){S.sort=t.value;renderList()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="f-q"){S.q=e.target.value;renderList()}
  onNotes(e);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)$("overlay").hidden=true});
